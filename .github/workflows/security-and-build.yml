name: Security and build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

      - name: Test game engine
        run: npm test

      - name: Validate card data
        run: npm run validate:data

      - name: Build
        run: npm run build
